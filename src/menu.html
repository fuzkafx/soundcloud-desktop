<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Menu</title>
<style>
  /* Та же графитовая палитра, что у мини-плеера. Панель 12, поле 4, пункт 12 − 4 = 8 */
  :root {
    --acc: #ff5500;
    --panel: #19191b; --raised: #232325;
    --fg: #ededed; --dim: #a1a1a6; --muted: #85858b;
    --line: rgba(237,237,237,.08);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  .light {
    --panel: #ffffff; --raised: #f4f4f5;
    --fg: #171717; --dim: #525252; --muted: #737373;
    --line: rgba(23,23,23,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; user-select: none; }
  body { padding: 8px; font: 13px/20px "Segoe UI Variable Text", "Segoe UI", sans-serif; color: var(--fg); }
  .panel {
    display: inline-flex; flex-direction: column; min-width: 220px; max-width: 320px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px;
    box-shadow: 0 4px 16px rgba(0,0,0,.28);
    opacity: 0; transform: translateY(4px);
  }
  .panel.in { opacity: 1; transform: none; transition: opacity 160ms var(--ease), transform 160ms var(--ease); }
  .item {
    display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 8px; border-radius: 8px;
    cursor: default; outline: none; white-space: nowrap; transition: background-color 120ms var(--ease);
  }
  .item .mark { flex: none; width: 16px; height: 16px; color: var(--acc); }
  .item .mark svg { width: 16px; height: 16px; display: block; }
  .item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .item.active { background: var(--raised); }
  .item.disabled { color: var(--muted); }
  .item.head { height: auto; min-height: 32px; padding-top: 6px; padding-bottom: 6px; }
  .item.head .label { color: var(--dim); white-space: normal; line-height: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .item.danger .label { color: var(--fg); }
  .sep { height: 1px; background: var(--line); margin: 4px 8px; }
</style>
</head>
<body>
<div class="panel" id="panel" role="menu"></div>
<script>
  const panel = document.getElementById('panel');
  const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
  let items = [], idx = -1;

  function render(p) {
    document.body.className = p.theme === 'light' ? 'light' : '';
    document.documentElement.style.setProperty('--acc', p.accent || '#ff5500');
    panel.classList.remove('in');
    panel.innerHTML = '';
    items = [];
    for (const it of p.items) {
      if (it.type === 'separator') { const s = document.createElement('div'); s.className = 'sep'; panel.appendChild(s); continue; }
      const el = document.createElement('div');
      el.className = 'item' + (it.enabled === false ? ' disabled' : '') + (it.type === 'header' ? ' head disabled' : '');
      el.setAttribute('role', it.type === 'checkbox' ? 'menuitemcheckbox' : 'menuitem');
      if (it.type === 'checkbox') el.setAttribute('aria-checked', String(!!it.checked));
      el.innerHTML = `<span class="mark">${it.checked ? CHECK : ''}</span><span class="label"></span>`;
      el.querySelector('.label').textContent = it.label;
      if (it.type === 'header') el.querySelector('.mark').remove();
      if (it.enabled !== false && it.type !== 'header') {
        const n = items.length;
        items.push({ el, id: it.id });
        el.onmouseenter = () => setActive(n);
        el.onclick = () => menu.pick(it.id);
      }
      panel.appendChild(el);
    }
    idx = -1;
    // Размер меряем сразу: в скрытом окне requestAnimationFrame не срабатывает
    const r = panel.getBoundingClientRect();
    menu.size(Math.ceil(r.width) + 16, Math.ceil(r.height) + 16);
    setTimeout(() => panel.classList.add('in'), 16);
  }
  function setActive(n) {
    items.forEach((x, i) => x.el.classList.toggle('active', i === n));
    idx = n;
  }
  panel.onmouseleave = () => setActive(-1);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') return menu.close();
    if (!items.length) return;
    if (e.key === 'ArrowDown') { setActive((idx + 1) % items.length); e.preventDefault(); }
    if (e.key === 'ArrowUp') { setActive((idx - 1 + items.length) % items.length); e.preventDefault(); }
    if ((e.key === 'Enter' || e.key === ' ') && idx >= 0) { menu.pick(items[idx].id); e.preventDefault(); }
  });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  menu.onShow(render);
</script>
</body>
</html>
